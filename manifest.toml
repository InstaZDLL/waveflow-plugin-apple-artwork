schema_version = 1

[plugin]
id = "apple-artwork"
name = "Apple Motion Artwork"
version = "0.3.0"
author = "InstaZDLL"
world = "waveflow:metadata/v1"
description = "Shows animated Apple Music album artwork while your music is playing."
homepage = "https://github.com/InstaZDLL/waveflow-plugin-apple-artwork"
license = "MIT"

# Propagated to the other locales, like every user-facing string in the
# app. Japanese is pending a native-speaker pass and falls back to
# English until then.
[plugin.description_i18n]
fr = "Affiche les pochettes animées d'Apple Music pendant la lecture."
es = "Muestra portadas animadas de Apple Music mientras suena tu música."
de = "Zeigt animierte Album-Cover von Apple Music, während deine Musik läuft."
it = "Mostra le copertine animate di Apple Music durante l'ascolto."
nl = "Toont geanimeerde albumhoezen van Apple Music terwijl je muziek speelt."
pt = "Mostra capas de álbum animadas do Apple Music enquanto a música toca."
"pt-BR" = "Mostra capas de álbum animadas do Apple Music enquanto a música toca."
ru = "Показывает анимированные обложки Apple Music во время воспроизведения."
tr = "Müziğiniz çalarken Apple Music'in hareketli albüm kapaklarını gösterir."
id = "Menampilkan sampul album animasi dari Apple Music saat musik diputar."
ko = "음악이 재생되는 동안 움직이는 Apple Music 앨범 아트워크를 표시합니다."
"zh-CN" = "在播放音乐时显示 Apple Music 的动态专辑封面。"
"zh-TW" = "在播放音樂時，顯示 Apple Music 的動態專輯封面。"
ar = "يعرض أغلفة ألبومات متحركة من Apple Music أثناء تشغيل الموسيقى."
hi = "संगीत चलने के दौरान Apple Music के एनिमेटेड एल्बम आर्टवर्क दिखाता है।"

[permissions]
# The plugin fetches: the iTunes search API (album lookup), the Apple Music
# web page + its JS bundles (anonymous token), the AMP catalogue API
# (editorialVideo), and the motion m3u8 (to resolve a playable mp4). The
# final mp4 is loaded by the app's <video>, NOT through the plugin — so it
# doesn't need to be on this list.
http = [
  "https://itunes.apple.com/**",
  "https://music.apple.com/**",
  "https://amp-api.music.apple.com/**",
  "https://mvod.itunes.apple.com/**",
]
storage_read = false
# Caches resolved motion URLs + a negative sentinel + the anonymous token,
# so a given album hits Apple at most once and the app stays Apple-friendly.
storage_state = true

# User-configurable options, surfaced in Settings → Plugins → ⚙️.
[[options]]
key = "prefer_hevc"
type = "bool"
label = "Prefer 4K HEVC covers"
default = "false"
description = "Use Apple's highest-resolution H.265 (HEVC) rendition when available. Only enable if your system can decode HEVC video — otherwise the cover won't load. Off = compatible H.264 1080p."

[options.label_i18n]
fr = "Préférer les pochettes 4K HEVC"
es = "Preferir portadas 4K HEVC"
de = "4K-HEVC-Cover bevorzugen"
it = "Preferisci le copertine 4K HEVC"
nl = "4K HEVC-hoezen verkiezen"
pt = "Preferir capas 4K HEVC"
"pt-BR" = "Preferir capas 4K HEVC"
ru = "Предпочитать обложки 4K HEVC"
tr = "4K HEVC kapakları tercih et"
id = "Utamakan sampul 4K HEVC"
ko = "4K HEVC 커버 선호"
"zh-CN" = "优先使用 4K HEVC 封面"
"zh-TW" = "偏好 4K HEVC 封面"
ar = "تفضيل أغلفة 4K HEVC"
hi = "4K HEVC कवर को प्राथमिकता दें"

[options.description_i18n]
fr = "Utilise la version H.265 (HEVC) la plus haute résolution d'Apple quand elle existe. À n'activer que si votre système sait décoder le HEVC, sinon la pochette ne se charge pas. Désactivé : H.264 1080p, compatible partout."
es = "Usa la versión H.265 (HEVC) de mayor resolución de Apple cuando esté disponible. Actívalo solo si tu sistema puede decodificar HEVC; si no, la portada no se cargará. Desactivado: H.264 1080p, compatible con todo."
de = "Nutzt Apples H.265-Fassung (HEVC) in der höchsten Auflösung, wenn vorhanden. Aktiviere das nur, wenn dein System HEVC dekodieren kann, sonst lädt das Cover nicht. Aus: H.264 1080p, überall kompatibel."
it = "Usa la versione H.265 (HEVC) alla massima risoluzione di Apple, quando disponibile. Attivala solo se il tuo sistema sa decodificare l'HEVC, altrimenti la copertina non si carica. Disattivata: H.264 1080p, compatibile con tutto."
nl = "Gebruikt Apples H.265-versie (HEVC) met de hoogste resolutie als die er is. Zet dit alleen aan als je systeem HEVC kan decoderen, anders laadt de hoes niet. Uit: H.264 1080p, overal compatibel."
pt = "Usa a versão H.265 (HEVC) de maior resolução da Apple, quando existe. Ativa apenas se o teu sistema souber descodificar HEVC; caso contrário, a capa não carrega. Desativado: H.264 1080p, compatível com tudo."
"pt-BR" = "Usa a versão H.265 (HEVC) de maior resolução da Apple, quando existe. Ative só se o seu sistema souber decodificar HEVC; caso contrário, a capa não carrega. Desativado: H.264 1080p, compatível com tudo."
ru = "Использует версию H.265 (HEVC) от Apple в наивысшем разрешении, если она есть. Включайте только если система умеет декодировать HEVC, иначе обложка не загрузится. Выключено: H.264 1080p, совместимо со всем."
tr = "Varsa Apple'ın en yüksek çözünürlüklü H.265 (HEVC) sürümünü kullanır. Yalnızca sisteminiz HEVC çözebiliyorsa açın; aksi hâlde kapak yüklenmez. Kapalı: her yerde çalışan H.264 1080p."
id = "Memakai versi H.265 (HEVC) resolusi tertinggi dari Apple bila tersedia. Aktifkan hanya jika perangkatmu bisa mendekode HEVC; kalau tidak, sampulnya tidak akan dimuat. Nonaktif: H.264 1080p yang lebih kompatibel."
ko = "가능한 경우 Apple의 최고 해상도 H.265(HEVC) 버전을 사용합니다. 시스템에서 HEVC 비디오를 디코딩할 수 있는 경우에만 활성화하세요. 그렇지 않으면 커버가 로드되지 않습니다. 끄기 = 호환되는 H.264 1080p."
"zh-CN" = "在可用时使用 Apple 分辨率最高的 H.265 (HEVC) 规格。仅当你的系统支持 HEVC 视频解码时才启用，否则封面将无法加载。关闭 = 使用兼容的 H.264 1080p。"
"zh-TW" = "盡可能使用 Apple 最高解析度的 H.265 (HEVC) 版本。請僅在您的系統能解碼 HEVC 影片時啟用，否則封面將無法載入。關閉 = 相容的 H.264 1080p。"
ar = "يستخدم نسخة H.265 (HEVC) بأعلى دقة من Apple عند توفرها. لا تفعّله إلا إذا كان نظامك يستطيع فك ترميز HEVC، وإلا فلن يُحمَّل الغلاف. عند الإيقاف: H.264 بدقة 1080p، وهو متوافق مع كل الأجهزة."
hi = "उपलब्ध होने पर Apple का सबसे उच्च रिज़ॉल्यूशन वाला H.265 (HEVC) संस्करण उपयोग करता है। इसे तभी चालू करें जब आपका सिस्टम HEVC डिकोड कर सके, वरना कवर लोड नहीं होगा। बंद होने पर H.264 1080p उपयोग होता है, जो हर जगह चलता है।"
