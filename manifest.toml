schema_version = 1

[plugin]
id = "apple-artwork"
name = "Apple Motion Artwork"
version = "0.3.0"
author = "InstaZDLL"
world = "waveflow:metadata/v1"
description = "Animated album covers (motion artwork) from Apple Music, rendered behind the now-playing view."
homepage = "https://github.com/InstaZDLL/waveflow-plugin-apple-artwork"
license = "MIT"

# Translations of `description`, shown by WaveFlow 1.8.0+ in the user's
# language. Older hosts ignore this table and keep rendering the plain
# English string above — which is why the translations live HERE rather
# than replacing `description` with a language map: a host predating the
# feature type-errors on that form and drops the plugin entirely.
# "now-playing view" uses each locale's own wording for that screen.
[plugin.description_i18n]
fr = "Pochettes d'album animées (motion artwork) depuis Apple Music, affichées derrière la vue En cours de lecture."
de = "Animierte Albumcover (Motion Artwork) aus Apple Music, hinter der Ansicht „Wird gespielt“ dargestellt."
es = "Portadas de álbum animadas (motion artwork) de Apple Music, mostradas detrás de la vista Reproduciendo ahora."
it = "Copertine animate degli album (motion artwork) da Apple Music, mostrate dietro la vista In riproduzione."
nl = "Geanimeerde albumhoezen (motion artwork) van Apple Music, weergegeven achter de weergave Speelt nu."
pt = "Capas de álbum animadas (motion artwork) do Apple Music, apresentadas por trás da vista Agora a reproduzir."
"pt-BR" = "Capas de álbum animadas (motion artwork) do Apple Music, exibidas atrás da tela Tocando agora."
ru = "Анимированные обложки альбомов (motion artwork) из Apple Music, отображаемые позади экрана «Сейчас играет»."
tr = "Apple Music'ten animasyonlu albüm kapakları (motion artwork), Şimdi çalıyor görünümünün arkasında gösterilir."
id = "Sampul album animasi (motion artwork) dari Apple Music, ditampilkan di belakang tampilan Sedang diputar."
ja = "Apple Music のアニメーションアルバムカバー（モーションアートワーク）を「再生中」画面の背景に表示します。"
ko = "Apple Music의 애니메이션 앨범 커버(모션 아트워크)를 '지금 재생 중' 화면 뒤에 표시합니다."
"zh-CN" = "来自 Apple Music 的动态专辑封面（motion artwork），显示在“正在播放”视图后方。"
"zh-TW" = "來自 Apple Music 的動態專輯封面（motion artwork），顯示於「現在播放」畫面後方。"
ar = "أغلفة ألبومات متحركة (motion artwork) من Apple Music، تُعرض خلف واجهة «قيد التشغيل»."
hi = "Apple Music से एनिमेटेड एल्बम कवर (motion artwork), \"अब चल रहा है\" व्यू के पीछे दिखाए जाते हैं।"

[permissions]
# The plugin fetches: the iTunes search API (album lookup), the Apple Music
# web page + its JS bundles (anonymous token), the AMP catalogue API
# (editorialVideo), and the motion m3u8 (to resolve a playable mp4). The
# final mp4 is loaded by the app's <video>, NOT through the plugin — so it
# doesn't need to be on this list.
http = [
  "https://itunes.apple.com/**",
  "https://music.apple.com/**",
  "https://amp-api.music.apple.com/**",
  "https://mvod.itunes.apple.com/**",
]
storage_read = false
# Caches resolved motion URLs + a negative sentinel + the anonymous token,
# so a given album hits Apple at most once and the app stays Apple-friendly.
storage_state = true

# User-configurable options, surfaced in Settings → Plugins → ⚙️.
[[options]]
key = "prefer_hevc"
type = "bool"
label = "Prefer 4K HEVC covers"
default = "false"
description = "Use Apple's highest-resolution H.265 (HEVC) rendition when available. Only enable if your system can decode HEVC video — otherwise the cover won't load. Off = compatible H.264 1080p."

# Same sibling-table rule as [plugin.description_i18n] above. Codec names
# (HEVC, H.265, H.264, 4K, 1080p) stay verbatim in every language.
[options.label_i18n]
fr = "Préférer les pochettes 4K HEVC"
de = "4K-HEVC-Cover bevorzugen"
es = "Preferir portadas 4K HEVC"
it = "Preferisci le copertine 4K HEVC"
nl = "Voorkeur voor 4K HEVC-hoezen"
pt = "Preferir capas 4K HEVC"
"pt-BR" = "Preferir capas 4K HEVC"
ru = "Предпочитать обложки 4K HEVC"
tr = "4K HEVC kapakları tercih et"
id = "Utamakan sampul 4K HEVC"
ja = "4K HEVC のカバーを優先"
ko = "4K HEVC 커버 우선"
"zh-CN" = "优先使用 4K HEVC 封面"
"zh-TW" = "優先使用 4K HEVC 封面"
